name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: messaging_user
          POSTGRES_PASSWORD: messaging_pass
          POSTGRES_DB: messaging_db
        ports: [5432:5432]
      redis:
        image: redis:7
        ports: [6379:6379]
    env:
      DATABASE_URL: postgres://messaging_user:messaging_pass@localhost:5432/messaging_db
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: testsecret
      RUST_LOG: info
      PORT: 8080
    steps:
      - uses: actions/checkout@v3

      # Backend build & test
      - name: Set up Rust
        uses: actions/setup-rust@v1
        with:
          rust-version: 1.76
      - name: Build backend
        run: cd backend && cargo build --release
      - name: Run backend tests
        run: cd backend && cargo test

      # Frontend build & test
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18
      - name: Install frontend dependencies
        run: cd frontend && npm install
      - name: Build frontend
        run: cd frontend && npm run build
      # Uncomment if you have frontend tests
