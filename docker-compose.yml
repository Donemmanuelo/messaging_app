version: '3.8'
services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgres://messaging_user:messaging_pass@db:5432/messaging_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=supersecretkey
      - RUST_LOG=info
      - PORT=8080
    depends_on:
      - db
      - redis
    ports:
      - "8080:8080"
  frontend:
    build: ./frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8080
    depends_on:
      - backend
    ports:
      - "3000:3000"
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: messaging_user
      POSTGRES_PASSWORD: messaging_pass
      POSTGRES_DB: messaging_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"
volumes:
  pgdata: 